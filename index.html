<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Bottle Predictor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./index.html">Spin the Bottle Predictor</a>
  </header>

  <main>
    <section class="hero">
      <h1>Spin the Bottle Predictor</h1>
      <p>Try the UP/DOWN demo.</p>
      <div class="card">
        <h2>Demo result</h2>
        <p id="result">Ready to try?</p>
        <button id="predictBtn" type="button">Get Demo Result</button>
      </div>
    </section>

    <section class="card" id="account">
      <h2>Create an account</h2>
      <p>Registration is not connected yet. We'll connect it to Supabase next.</p>
      <button id="createAccountBtn" type="button">Create account</button>
      <p id="message" role="status"></p>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Spin the Bottle Predictor · Demo only.</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
